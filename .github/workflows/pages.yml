name: Test public site constraints
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test site constraints (ledger rows 1/5/6/7/9 + release gate)
        run: |
          pip install pytest
          python -m pytest tests/ -q
      - name: Build (map dir is the committed snapshot; build refreshes the rest)
        run: |
          python tools/build.py docs
          test -f docs/index.html